<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Salle des présentations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Écran de verrouillage -->
<main id="login" class="login" hidden>
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand"><i></i>Salle des présentations</div>
    <p class="muted">Accès protégé. Entre le mot de passe pour déchiffrer la bibliothèque.</p>
    <input type="text" name="username" value="salle" autocomplete="username" hidden>
    <label for="pw">Mot de passe</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <label class="check"><input id="remember" type="checkbox"> Rester connecté sur cet appareil</label>
    <button class="btn primary" id="unlockBtn" type="submit">Déverrouiller</button>
    <p class="err" id="loginErr" role="alert" hidden></p>
  </form>
</main>

<!-- Application -->
<div class="wrap" id="app" hidden>
  <header class="top">
    <div class="brand"><i></i>Salle des présentations</div>
    <button class="btn lock" id="lockBtn" title="Verrouiller et oublier le mot de passe">🔒 Verrouiller</button>
    <div class="stats" id="stats"></div>
  </header>

  <section>
    <div class="controls">
      <div class="row">
        <input class="search" id="q" type="search" placeholder="Rechercher un titre, un sujet, un tag…" aria-label="Rechercher">
        <select id="aud" aria-label="Audience"></select>
        <select id="dur" aria-label="Durée">
          <option value="">Toutes durées</option>
          <option value="s">Éclair · moins de 15 min</option>
          <option value="m">Standard · 15–45 min</option>
          <option value="l">Long · plus de 45 min</option>
        </select>
        <select id="sort" aria-label="Tri">
          <option value="new">Plus récentes</option>
          <option value="short">Plus courtes</option>
          <option value="az">A → Z</option>
        </select>
      </div>
      <div class="chips" id="domains"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Détail de la présentation"></aside>

<div class="stage" id="stage" hidden>
  <div class="bar" id="stBar">
    <button id="exit">✕ Quitter</button>
    <span id="stTitle" class="stt"></span>
    <div class="timer"><span class="plan">Prévu <span id="stPlan"></span></span><b id="stClock">00:00</b></div>
    <button id="fs" title="Plein écran">⛶</button>
    <button id="mini" title="Réduire la barre">▴</button>
  </div>
  <div class="prog"><i id="stProg"></i></div>
  <div class="canvas">
    <p id="stLoad" class="muted">Déchiffrement…</p>
    <iframe id="frame" title="Présentation" sandbox="allow-scripts allow-popups allow-forms allow-modals allow-presentation" allow="fullscreen; autoplay"></iframe>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
