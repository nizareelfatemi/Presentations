<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Présentation</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#0d0e10;color:#cfd4e2;font:16px system-ui,"Segoe UI",sans-serif;overflow:hidden}
  #msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
  #msg.err{color:#ff9b9b}
  #frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #xp{position:fixed;top:10px;right:12px;z-index:5;border:1px solid rgba(255,255,255,.35);background:rgba(13,14,16,.72);color:#fff;font:600 12px system-ui,"Segoe UI",sans-serif;padding:6px 12px;border-radius:99px;cursor:pointer;opacity:.45;transition:opacity .15s}
  #xp:hover,#xp:focus-visible{opacity:1}
  #xp:disabled{cursor:progress}
</style>
</head>
<body>
<p id="msg">Chargement de la présentation…</p>
<button id="xp" type="button" hidden title="Exporter en PPTX (vidéos lisibles)">⬇ PPTX</button>
<iframe id="frame" title="Présentation" hidden sandbox="allow-scripts allow-popups allow-forms allow-modals allow-presentation" allow="fullscreen; autoplay"></iframe>
<script>
"use strict";
// Lien de partage : #<fichier>.<clé>. La clé reste dans le fragment (jamais envoyée au serveur).
// Elle ouvre uniquement cette présentation ; le mot de passe de la bibliothèque n'est pas nécessaire.
(async () => {
  const msg = document.getElementById("msg"), frame = document.getElementById("frame");
  const fail = (t) => { msg.className = "err"; msg.textContent = t; msg.hidden = false; frame.hidden = true; };
  const m = /^#([0-9a-f]{32})\.([A-Za-z0-9_-]{43})$/.exec(location.hash);
  if (!m) return fail("Lien invalide.");
  try {
    const raw = Uint8Array.from(atob(m[2].replace(/-/g, "+").replace(/_/g, "/") + "="), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const r = await fetch(`data/${m[1]}.bin`, { cache: "no-cache" });
    if (!r.ok) return fail("Présentation introuvable.");
    const buf = new Uint8Array(await r.arrayBuffer());
    let html;
    try { html = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)); }
    catch { return fail("Ce lien n’est plus valide (révoqué ou incorrect)."); }
    const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    // Export PPTX : même clé que la présentation (fichier pré-généré au déploiement)
    const title = (/<title>([^<]*)<\/title>/i.exec(new TextDecoder().decode(html)) || [])[1] || "presentation";
    const xp = document.getElementById("xp"), px = `data/${m[1]}.pptx.bin`;
    fetch(px, { method: "HEAD", cache: "no-cache" }).then((h) => {
      if (!h.ok) return;
      xp.hidden = false;
      xp.onclick = async () => {
        const lab = xp.textContent; xp.disabled = true; xp.textContent = "Préparation…";
        try {
          const b = new Uint8Array(await (await fetch(px, { cache: "no-cache" })).arrayBuffer());
          const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12));
          const slug = title.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 80) || "presentation";
          const u = URL.createObjectURL(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.presentationml.presentation" }));
          const a = Object.assign(document.createElement("a"), { href: u, download: slug + ".pptx" });
          document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
          xp.textContent = "✓ Téléchargé";
        } catch { xp.textContent = "Échec"; }
        setTimeout(() => { xp.textContent = lab; xp.disabled = false; }, 2500);
      };
    }).catch(() => {});
    frame.onload = () => { msg.hidden = true; frame.hidden = false; frame.focus(); };
    frame.src = url;
  } catch { fail("Impossible d’ouvrir cette présentation."); }
})();
</script>
</body>
</html>
